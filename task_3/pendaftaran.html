<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport">
  <title>Pendaftaran Perpustakaan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Perpustakaan Kampus</h1>
    <nav>
      <a href="pendaftaran.html">Pendaftaran</a>
      <a href="detail.html">Detail Informasi</a>
    </nav>
  </header>

  <main class="kotak-utama">
    <h2>Daftar Anggota Baru</h2>
    
    <form method="get" action="detail.html">
      <div class="grup-input">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" required>
      </div>

      <div class="grup-input">
        <label for="nim">NIM</label>
        <input type="text" id="nim" name="nim" pattern="[0-9]+" title="NIM hanya boleh berisi angka" required>
      </div>

      <div class="grup-input">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="grup-input">
        <label for="prodi">Program Studi</label>
        <select id="prodi" name="prodi" required>
          <option value="informatika">Teknik Informatika</option>
          <option value="sipil">Teknik Sipil</option>
          <option value="arsitektur">Arsitektur</option>
          <option value="elektro">Teknik Elektro</option>
          <option value="dkv">Desain Komunikasi Visual</option>
          <option value="kimia">Teknik Kimia</option>
          <option value="rekhut">Rekayasa Kehutanan</option>
        </select>
      </div>

      <div class="grup-input">
        <input type="checkbox" id="setuju" name="setuju" required>
        <label for="setuju" style="display:inline; font-weight:normal;">Saya bersedia mematuhi aturan perpustakaan</label>
      </div>

      <button type="submit">Daftar Sekarang</button>
    </form>
  </main>
</body>
</html>
